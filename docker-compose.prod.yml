services:
  db:
    image: postgres:16-alpine
    restart: always
    environment:
      POSTGRES_DB: gestaobets
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    restart: always
    expose:
      - "8000"
    environment:
      DATABASE_URL: postgresql://postgres:postgres@db:5432/gestaobets
    volumes:
      - uploads_data:/app/uploads
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - .env

  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_URL: ${SITE_URL}
    restart: always
    expose:
      - "3000"
    depends_on:
      - backend

volumes:
  postgres_data:
  uploads_data:
