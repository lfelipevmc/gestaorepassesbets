# Redireciona HTTP para HTTPS automaticamente
server {
    listen 80;
    server_name tculeads.vascav.com.br;
    return 301 https://$host$request_uri;
}

# HTTPS — proxy para backend e frontend
server {
    listen 443 ssl;
    server_name tculeads.vascav.com.br;

    ssl_certificate     /etc/letsencrypt/live/tculeads.vascav.com.br/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/tculeads.vascav.com.br/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;

    client_max_body_size 30M;

    # API (backend FastAPI)
    location /api/ {
        proxy_pass         http://localhost:8000;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    # Frontend Next.js
    location / {
        proxy_pass         http://localhost:3000;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade $http_upgrade;
        proxy_set_header   Connection "upgrade";
    }
}
